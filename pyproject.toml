[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-agent-skills"
version = "0.14.0.dev1"
description = "Preview workflow for offline After Effects project editing with py-aep and live runtime verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "py-aep==0.15.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "PyYAML>=6.0.2",
]

[project.scripts]
ae-cli = "ae_cli.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
