[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-agent-skills"
version = "0.15.0"
description = "Offline-first workflow for After Effects project editing with py-aep and live runtime verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "py-aep==0.19.0",
  "requests>=2.31.0",
  "playwright==1.65.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "PyYAML>=6.0.2",
]

[project.scripts]
ae-cli = "ae_cli.main:run"
ae-generative = "ae_generative.cli:run"

[tool.setuptools]
packages = ["ae_cli", "ae_generative"]
package-dir = {"ae_cli" = "src/ae_cli", "ae_generative" = "skills/aftereffects-py-aep/scripts/ae_generative"}
